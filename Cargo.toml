[workspace]
resolver = "2"
members = [
    "crates/svision-core",
    "crates/svision-raster-soft",
    "crates/svision-winit",
    "crates/svision-backend-softbuffer",
    "crates/svision-backend-gdiplus",
    "crates/svision-demo",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://example.invalid/svision"

[workspace.dependencies]
svision-core = { path = "crates/svision-core" }
svision-raster-soft = { path = "crates/svision-raster-soft" }
svision-winit = { path = "crates/svision-winit" }
svision-backend-softbuffer = { path = "crates/svision-backend-softbuffer" }
svision-backend-gdiplus = { path = "crates/svision-backend-gdiplus" }

winit = "0.30.13"
softbuffer = "0.4.8"
tiny-skia = "0.12.0"
fontdue = "0.9.5"
raw-window-handle = "0.6"
windows = "0.62.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
